name: Deploy ManagerPro PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate PWA files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f manifest.webmanifest
          test -f sw.js
          test -f icon-192.svg
          test -f icon-512.svg
          test -f icon-512-maskable.svg
          grep -q 'manifest.webmanifest' index.html
          grep -q 'serviceWorker' index.html
          grep -q '"display"[[:space:]]*:[[:space:]]*"standalone"' manifest.webmanifest
          grep -q '192x192' manifest.webmanifest
          grep -q '512x512' manifest.webmanifest
          grep -q 'maskable' manifest.webmanifest
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
